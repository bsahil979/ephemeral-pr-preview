services:
  # Main / Baseline Application
  app-main:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: preview-main
    environment:
      - PORT=3000
      - APP_ENV=production
      - PR_NUMBER=
      - GIT_SHA=main-head
      - BASE_PATH=
      - THEME_NAME=indigo
      - FEATURE_NAME=Stable Production Release
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Simulated Preview Environment for PR #1
  preview-pr-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: preview-pr-1
    environment:
      - PORT=3000
      - APP_ENV=preview-pr-1
      - PR_NUMBER=1
      - GIT_SHA=pr1-sha7
      - BASE_PATH=/pr-1
      - THEME_NAME=cyan
      - FEATURE_NAME=PR #1: Cyan Theme & Diagnostics Inspector
    ports:
      - "30001:3000"
    restart: unless-stopped

  # Dynamic Nginx Reverse Proxy
  proxy:
    image: nginx:alpine
    container_name: preview-local-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx-compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-main
      - preview-pr-1
    restart: unless-stopped
