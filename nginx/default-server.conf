# ==============================================================================
# Base Nginx Gateway Configuration for Ubuntu Host (/etc/nginx/sites-available/default)
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Root landing page
    location = / {
        root /var/www/html;
        index index.html;
    }

    # Gateway Health Check
    location = /gateway-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"GATEWAY_UP","service":"nginx-reverse-proxy"}';
    }

    # Include all dynamically generated PR preview routes
    include /etc/nginx/previews/*.conf;
}
