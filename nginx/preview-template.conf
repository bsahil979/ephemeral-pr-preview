# ==============================================================================
# Dynamic PR Preview Route Template (/etc/nginx/previews/pr-${PR_NUMBER}.conf)
# ==============================================================================

# Redirect non-trailing slash to trailing slash
location = /pr-${PR_NUMBER} {
    return 301 /pr-${PR_NUMBER}/;
}

# Proxy all traffic to the isolated preview container on loopback
location /pr-${PR_NUMBER}/ {
    proxy_pass http://127.0.0.1:${PORT}/;
    proxy_http_version 1.1;

    # Standard reverse proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /pr-${PR_NUMBER};

    # Resiliency timeouts
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
}
