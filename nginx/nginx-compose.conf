server {
    listen 80;
    server_name localhost;

    # Production / Main application route
    location / {
        proxy_pass http://app-main:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ephemeral Preview PR #1 Route
    location = /pr-1 {
        return 301 /pr-1/;
    }

    location /pr-1/ {
        proxy_pass http://preview-pr-1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /pr-1;
    }
}
